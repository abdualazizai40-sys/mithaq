<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميثاق الأداء للمراقبين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one working column (max 980px), a sticky header with the role switch,
   summary first, then one card per axis; tables scroll inside their own box. */
:root{
  color-scheme:light;
  --bg:#F3F6F5; --surface:#ffffff; --surface-2:#EEF3F2; --line:#D5E0DE;
  --ink:#12302D; --muted:#5A6E6B;
  --accent:#00524D; --accent-ink:#ffffff; --accent-soft:#E3EFEC;
  --gold:#8A6A2A; --gold-line:#C9A45C; --gold-soft:#F6F1E6;
  --good:#00524D; --warn:#9A5B0B; --bad:#B3382C; --warn-soft:#FBEED6; --bad-soft:#F9E1DD;
  --font-display:"Tajawal","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.25rem} h2{font-size:1.1rem} h3{font-size:1rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tn{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto}
.brand small{color:var(--muted);font-size:.8rem}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--font-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);font-size:.9rem}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.875rem;font-weight:500;color:var(--muted);min-width:0;justify-content:flex-end}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;width:100%}
textarea{min-height:72px;resize:vertical}
input[type="checkbox"]{width:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--font-body);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.lv-below{background:var(--bad-soft);color:var(--bad)}
.lv-dev{background:var(--warn-soft);color:var(--warn)}
.lv-meets{background:var(--accent-soft);color:var(--good)}
.lv-above{background:var(--gold-soft);color:var(--gold)}
.lv-ideal{background:var(--good);color:var(--surface)}
.lv-none{background:var(--surface-2);color:var(--muted)}
/* summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px 24px;align-items:center}
.score{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1}
.score small{font-size:1.1rem;color:var(--muted);font-weight:500}
.track{position:relative;height:14px;border-radius:999px;background:var(--surface-2)}
.fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--accent);width:0;transition:width .25s}
.mark{position:absolute;inset-block:-5px;width:3px;background:var(--gold);border-radius:2px}
.legend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend b{color:var(--gold)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.axis-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.opsbox{background:var(--accent-soft);border-color:var(--accent)}
.opsbox .res{background:var(--surface)}
.ops{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.res{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:10px 14px}
.res .big{font-family:var(--font-display);font-size:1.6rem;line-height:1}
.ops > b{font-family:var(--font-display);font-size:2rem;line-height:1}
.fp{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.fp ul{margin:4px 0 0;padding-inline-start:20px}
.rem{font-size:.9rem;font-weight:500}
.rem.ok{color:var(--good)} .rem.todo{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile b{display:block;margin-top:4px;font-family:var(--font-display);font-size:1.6rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.82rem}
td select{min-width:120px}
details.emp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.emp summary{cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;list-style:none}
details.emp summary::-webkit-details-marker{display:none}
details.emp .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:.9rem}
.axis-edit{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.fld-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld-row > input[type="text"]{flex:1 1 180px;width:auto}
footer{color:var(--muted);font-size:.82rem;text-align:center;padding:0 16px 32px}
#toast{position:fixed;inset-inline:16px;bottom:16px;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;text-align:center;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ---- هوية الوزارة ---- */
h1,h2,h3{font-weight:800;color:var(--accent)}
h2{font-size:1.2rem}
header.top{border-bottom:3px solid var(--gold-line);box-shadow:0 2px 10px rgba(0,40,36,.06)}
.brand{flex-direction:row;align-items:center;gap:10px}
.brand img{width:44px;height:44px;flex:none}
.brand h1{font-size:1.2rem}
.brand .bt{display:flex;flex-direction:column;line-height:1.35}
.card{border-color:#E1E9E7;box-shadow:0 1px 3px rgba(0,40,36,.05)}
.btn{border-radius:12px;min-height:44px}
.btn.primary{font-family:var(--font-display);font-weight:700}
.btn.primary:hover{background:#003B37}
input,select,textarea{border-radius:12px;background:#F7FAF9;min-height:44px}
:focus-visible{outline-color:var(--gold-line)}
.seg button{min-height:38px}
.mark{background:var(--gold-line)}
.legend b{color:var(--gold)}
.banner{border-color:var(--gold-line)}
.tile{border-color:#E1E9E7;box-shadow:0 1px 3px rgba(0,40,36,.05);border-top:3px solid var(--accent)}
.tile b{color:var(--accent);font-weight:800}
.lv-ideal{background:var(--accent);color:#fff}
.lv-above{background:var(--gold-soft);color:var(--gold)}
th{background:var(--surface-2)}
footer{padding-top:8px}
/* بطاقة الملخص الخضراء */
.hero-card{position:relative;overflow:hidden;background:var(--accent);color:#fff;border:0}
.hero-card::before{content:"";position:absolute;top:-80px;left:-80px;width:200px;height:200px;background:#0B6A63;border-radius:30px;transform:rotate(45deg)}
.hero-card::after{content:"";position:absolute;bottom:-110px;left:60px;width:180px;height:180px;border:1.5px solid #2EC4B6;border-radius:28px;transform:rotate(45deg);opacity:.45}
.hero-card > *{position:relative;z-index:1}
.hero-card h2{color:#fff}
.hero-card .muted,.hero-card .score small,.hero-card .legend{color:#BFE0DB}
.hero-card .legend b,.hero-card #sum-rank{color:#E9CF94 !important}
.hero-card .track{background:rgba(255,255,255,.18)}
.hero-card .fill{background:#fff}
.hero-card .banner{color:var(--ink)}
/* شاشة الدخول */
body.is-login{background:#04242A}
body.is-login header.top,body.is-login footer.site{display:none}
body.is-login main{max-width:none;padding:0}
.login-hero{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:40px;padding:48px clamp(16px,6vw,80px);color:#fff;
  background-image:linear-gradient(to left,rgba(4,36,42,.97) 0%,rgba(4,36,42,.9) 38%,rgba(4,40,46,.5) 75%,rgba(4,40,46,.25) 100%),url(assets/login-bg.jpg);background-size:cover;background-position:left center}
.login-hero .d1{position:absolute;top:-140px;left:-120px;width:420px;height:420px;border:2px solid #2EC4B6;border-radius:48px;transform:rotate(45deg);opacity:.5}
.login-hero .d2{position:absolute;top:-260px;left:-330px;width:520px;height:520px;background:#0E7C74;border-radius:56px;transform:rotate(45deg);opacity:.5}
.login-card{position:relative;flex:0 1 440px;background:#fff;color:var(--ink);border-radius:22px;padding:32px 32px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:18px}
.login-card .logo{height:96px;align-self:center}
.login-card .ttl{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.login-card .ttl h1{font-size:1.6rem}
.goldbar{width:56px;height:3px;background:var(--gold-line);border-radius:2px;margin-top:6px}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.lg-tabs button{min-height:44px;border:0;border-radius:9px;background:transparent;color:#3C5452;font:600 .95rem var(--font-body);cursor:pointer}
.lg-tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.login-card .btn.primary{min-height:52px;font-size:1.1rem;width:100%}
.login-card .note{font-size:.82rem;line-height:1.7;color:var(--muted);background:var(--gold-soft);border-radius:10px;padding:10px 12px}
.login-card .by{text-align:center;font-size:.78rem;color:var(--muted)}
.login-side{position:relative;flex:1 1 360px;max-width:560px;display:flex;flex-direction:column;gap:16px}
.login-side img{height:90px;align-self:flex-start}
.login-side h2{color:#fff;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.3}
.login-side p{color:#BFE0DB;font-size:1.05rem}
.login-side ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.login-side li{border:1px solid rgba(201,164,92,.6);color:#E9CF94;border-radius:999px;padding:4px 14px;font-size:.9rem}
@media (max-width:760px){.login-side{order:-1}.login-side img{height:64px}}
@media (max-width:520px){.summary{grid-template-columns:1fr}.mini{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fill,#toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="assets/moc-emblem.svg" alt="شعار وزارة التجارة"><div class="bt"><h1>ميثاق الأداء للمراقبين</h1><small>الشؤون الرقابية بمنطقة جازان</small></div></div>
  <div id="views" class="seg" role="group" aria-label="الواجهة"></div>
  <div id="who" class="row" style="gap:8px"></div>
</div></header>
<main class="wrap" id="app"><div class="card muted">جارٍ التحميل…</div></main>
<footer class="site">إعداد: م. عبدالعزيز قمعي</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- المعادلة الافتراضية (يعدّلها المدير من واجهته) ---------- */
const DEFAULT_CONFIG = { quotaIdeal:0, quotaAbove:0, productsTotal:330, year:2027, sendOpenDays:3, sendGraceDays:5, sendAlways:false, qualityTarget:100, showWeights:true, workDays:241, opsTarget:2410, groups:[{id:"g1",label:"الضبطيات",t:4}], maxScore:5, opsWeight:0.00104, bands:[
  {from:0,label:"غير مرضي"},{from:1.5,label:"يحتاج لتطوير"},{from:2.5,label:"وافق التوقعات"},
  {from:3.5,label:"فاق التوقعات"},{from:4.5,label:"مثالي"}], axes: [
  { id:"vis", name:"الزيارات", quality:true, qt:98, fields:[
    {id:"v1",label:"زيارات البلاغ"},{id:"v2",label:"الزيارات التصحيحية"},
    {id:"v3",label:"المهام المسندة"},{id:"v4",label:"الجولات الوزارية"},{id:"v5",label:"الزيارات التموينية"}]},
  { id:"rep", name:"البلاغات", quality:true, qt:95, fields:[
    {id:"b1",label:"بلاغات الرقابة التجارية"},{id:"b2",label:"بلاغات الغش التجاري"},
    {id:"b3",label:"بلاغات المعادن"},{id:"b6",label:"بلاغات سلامة المنتجات"},
    {id:"b5",label:"بلاغات المتاجر الإلكترونية"},{id:"b4",label:"بلاغات الوكالات التجارية"}]},
  { id:"rd", name:"القراءات التموينية", quality:false, fields:[
    {id:"r1",label:"القراءات التموينية",w:0.00005,t:9600}]},
  { id:"cs", name:"القضايا والمنتجات المضبوطة", quality:false, fields:[
    {id:"c1",label:"عدد القضايا لغير المنتجات",w:0.1,g:"g1"},{id:"p1",label:"المنتجات المضبوطة",w:0.0001225},
    {id:"c2",label:"قضايا المتاجر والوكالات",w:0.02,g:"g1"}]}
]};
const TONES = ["below","dev","meets","above","ideal"];
function validConfig(d){ return !!(d && Array.isArray(d.axes) && d.axes.length && typeof d.opsWeight === "number" && typeof d.opsTarget === "number" && Array.isArray(d.bands) && d.bands.length === 5); }

/* ---------- الحساب ----------
   الميثاق سنوي تراكمي: تُجمع إدخالات أشهر السنة ثم تُحسب الدرجة على المجموع.
   الدرجة = مجموع العمليات × وزن العملية + مجموع (كل خانة أخرى × وزنها)، بحد أقصى.
   مجموع العمليات = ناتج الزيارات + ناتج البلاغات، وناتج كل منهما في الشهر = مجموع خاناته × نسبة جودة ذلك الشهر. */
function n(v){ const x = parseFloat(v); return isFinite(x) && x > 0 ? x : 0; }
function monthCalc(config, values){
  values = values || {};
  let ops = 0; const ax = {}, fl = {};
  for (const a of config.axes){
    if (a.quality){
      const sum = a.fields.reduce((s,f) => s + n(values[f.id]), 0), rq = values[a.id + "_q"];
      const q = (rq === undefined || rq === "") ? 1 : Math.min(100, n(rq)) / 100;
      ax[a.id] = { sum, q, eff: sum * q }; ops += sum * q;
    } else for (const f of a.fields) fl[f.id] = n(values[f.id]);
  }
  return { ops, ax, fl };
}
function bandIdx(bands, total){ let idx = 0; bands.forEach((b,i) => { if (total >= n(b.from) - 1e-9) idx = i; }); return idx; }
function calc(config, list, fr){
  if (!Array.isArray(list)) list = [list || {}];
  if (fr === undefined) fr = 1;
  const ms = list.map(v => monthCalc(config, v)), add = (f) => ms.reduce((s,m) => s + f(m), 0);
  const ow = n(config.opsWeight), max = n(config.maxScore) || 5, bands = config.bands;
  const exp = Math.min(n(bands[2].from), max), ideal = Math.min(n(bands[4].from), max);
  let ops = 0, raw = 0; const targets = [];
  const axes = config.axes.map(a => {
    if (a.quality){
      const sum = add(m => m.ax[a.id].sum), eff = add(m => m.ax[a.id].eff);
      ops += eff; raw += eff * ow;
      return { id:a.id, name:a.name, quality:true, qt:a.qt, sum, eff, q: sum > 0 ? eff / sum : 1, got: eff * ow, fields:[] };
    }
    const fields = a.fields.map(f => { const val = add(m => m.fl[f.id]); return { id:f.id, label:f.label, val, w:n(f.w), t:n(f.t), g:f.g || "", got: val * n(f.w) }; });
    const got = fields.reduce((s,f) => s + f.got, 0); raw += got;
    return { id:a.id, name:a.name, quality:false, got, fields };
  });
  const groups = (config.groups || []).filter(g => n(g.t) > 0), gids = groups.map(g => g.id), all = [];
  for (const a of axes) for (const f of a.fields) all.push(f);
  if (n(config.opsTarget) > 0) targets.push({ label:"مجموع العمليات", unit:"عملية", done:ops, target:n(config.opsTarget), wMin:ow, wMax:ow, ops:true });
  for (const f of all) if (f.t > 0 && !gids.includes(f.g)) targets.push({ label:f.label, unit:"", done:f.val, target:f.t, wMin:f.w, wMax:f.w, ops:false });
  for (const g of groups){ const fs = all.filter(f => f.g === g.id); if (!fs.length) continue;
    targets.push({ label:g.label, unit:"", done:fs.reduce((s,f) => s + f.val, 0), target:n(g.t), wMin:Math.min(...fs.map(f => f.w)), wMax:Math.max(...fs.map(f => f.w)), ops:false, parts:fs.map(f => f.label) }); }
  for (const f of all) f.hasT = gids.includes(f.g) ? true : f.t > 0;
  for (const t of targets){ t.rem = Math.max(0, Math.ceil(t.target - t.done - 1e-9)); t.due = t.target * fr; t.diff = t.done - t.due; }
  const qDef = config.qualityTarget === undefined ? 100 : Math.min(100, n(config.qualityTarget));
  for (const a of axes) if (a.quality){ const qT = a.qt === undefined || a.qt === "" ? qDef : Math.min(100, n(a.qt)); if (!(qT > 0)) continue;
    const done = a.sum > 0 ? a.eff / a.sum * 100 : 0;
    targets.push({ label:"جودة " + a.name, unit:"", q:true, has:a.sum > 0, done, target:qT, wMin:0, wMax:0, ops:false, rem: Math.max(0, Math.round((qT - done) * 10) / 10), due:qT, diff:0 }); }
  const total = Math.round(Math.min(max, raw) * 100) / 100, toExp = Math.max(0, exp - total), toIdeal = Math.max(0, ideal - total);
  const idx = bandIdx(bands, total), next = bands[idx + 1], toNext = next ? Math.max(0, n(next.from) - total) : 0;
  const rq = k => Math.round(Math.min(max, targets.reduce((s,t) => s + t.target * t[k], 0)) * 100) / 100, reqScore = rq("wMin"), reqMax = rq("wMax");
  const proj = fr >= 0.05 && fr < 1 ? Math.round(Math.min(max, raw / fr) * 100) / 100 : null;
  /* المستوى المعروض خلال السنة هو المتوقع لنهايتها بحسب الوتيرة، لأن الدرجة التراكمية تبدأ منخفضة للجميع */
  let dIdx = idx, dLabel = bands[idx].label, dLevel = TONES[idx], projected = false;
  if (fr < 1){ if (proj !== null){ dIdx = bandIdx(bands, proj); dLabel = bands[dIdx].label; dLevel = TONES[dIdx]; projected = true; }
    else if (idx < 2){ dIdx = -1; dLabel = "بداية السنة"; dLevel = "none"; } }
  return { axes, ops, opsGot: ops * ow, total, raw, max, expScore: exp, idealScore: ideal, idx, level: TONES[idx], levelLabel: bands[idx].label, dIdx, dLabel, dLevel, projected,

  const rk = rankMap(yearOf(), S.me.id, r, selfList(yearOf(), S.draft));
  $("sum-rank").textContent = rk.n > 1 && r.total > 0 ? `ترتيبك بين المراقبين: ${rk[S.me.id]} من ${rk.n}.` : "";
  $("targets").innerHTML = targetsHTML(r);
  if ($("fp")) $("fp").innerHTML = fingerprintHTML(r, teamCalcs(yearOf(), S.me.id).concat([r]));
  if ($("ops-total")){
    $("ops-total").textContent = f0(m.ops);
    $("ops-parts").textContent = S.config.axes.filter(a => a.quality).map(a => `ناتج ${a.name} ${f0(m.ax[a.id].eff)}`).join(" + ");
    $("ops-got").textContent = f3(r.opsGot);
    $("ops-how").textContent = `تراكمي السنة ${f0(r.ops)} عملية` + (sw ? ` × وزن العملية ${n(S.config.opsWeight)}` : "");
  }
  for (const a of r.axes){
    const res = $("ax-" + a.id + "-res"); if (!res) continue;
    if (a.quality){ const x = m.ax[a.id]; res.textContent = f0(x.eff); $("ax-" + a.id + "-how").textContent = `المجموع ${f0(x.sum)} × نسبة الجودة ${f0(x.q*100)}%`; }
    else { res.textContent = f3(a.got); for (const f of a.fields){ const el = $("fg-" + f.id); if (el) el.textContent = `تراكمي السنة ${f0(f.val)}` + (sw ? ` × ${f.w}` : "") + ` = ${f3(f.got)} درجة`; } }
  }
}

/* --- تفاصيل ميثاق (للمشرف والمدير) --- */
function breakdown(r, team){
  let h = (team ? fingerprintHTML(r, team) : "") + `<div class="stack" style="gap:16px">${targetsHTML(r)}</div><div class="scroll"><table><thead><tr><th>البند (تراكمي السنة)</th><th>المنجز</th><th>المطلوب</th><th>الوزن</th><th>الدرجة</th></tr></thead><tbody>`;
  for (const a of r.axes) if (a.quality) h += `<tr><td>ناتج ${esc(a.name)}</td><td class="num">${f0(a.eff)} (من ${f0(a.sum)})</td><td></td><td></td><td></td></tr>`;
  h += `<tr><td><b>مجموع العمليات</b></td><td class="num"><b>${f0(r.ops)}</b></td><td class="num">${n(S.config.opsTarget) ? f0(n(S.config.opsTarget)) : ""}</td><td class="num">${n(S.config.opsWeight)}</td><td class="num"><b>${f3(r.opsGot)}</b></td></tr>`;
  for (const a of r.axes) if (!a.quality) for (const f of a.fields) h += `<tr><td>${esc(f.label)}</td><td class="num">${f0(f.val)}</td><td class="num">${f.t && !f.g ? f0(f.t) : ""}</td><td class="num">${f.w}</td><td class="num">${f3(f.got)}</td></tr>`;
  h += `</tbody></table></div>` + (r.proj === null ? "" : `<p class="small muted">على وتيرته الحالية سينهي السنة بدرجة ${f2(r.proj)} («${esc(r.projLabel)}»).</p>`);
  return h;
}

/* عدّادات الملخص: تظهر للمدير عن الجميع وللمشرف عن فريقه */
function statTiles(rows, y){
  const done = rows.filter(x => x.r), avg = done.length ? done.reduce((s,x) => s + x.r.total, 0) / done.length : 0;
  const rkT = rankMap(y), cnt = i => done.filter(x => finalIdx(x.id, x.r, rkT) === i).length, max = calc(S.config, [], 1).max;
  const behind = done.filter(x => paceClass(x.r) === "rem todo").length, met = done.filter(x => x.r.reqMet).length;
  return `<div class="tiles">
    <div class="tile"><span class="muted small">أدخلوا أعمالهم</span><b class="num">${done.length} / ${rows.length}</b></div>
    <div class="tile"><span class="muted small">متوسط الدرجة</span><b class="num">${f2(avg)} / ${f0(max)}</b></div>
    <div class="tile"><span class="muted small">حققوا المطلوب</span><b class="num">${met}</b></div>
    <div class="tile"><span class="muted small">متأخرون عن المسار</span><b class="num">${behind}</b></div>
  </div><div class="tiles">` + S.config.bands.map((b,i) => `<div class="tile"><span class="pill lv-${TONES[i]}">${esc(b.label)}</span><b class="num">${cnt(i)}</b></div>`).reverse().join("") + `</div>`;
}

  const done = rows.filter(x => x.r), avg = done.length ? done.reduce((s,x) => s + x.r.total, 0) / done.length : 0;
  const cnt = i => done.filter(x => x.r.dIdx === i).length, base = calc(S.config, [], yearFrac(y));
  const behind = done.filter(x => paceClass(x.r) === "rem todo").length, met = done.filter(x => x.r.reqMet).length;

    <div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="pdf-team">تنزيل تقرير الجميع PDF</button></div></div>${monthPicker("الفترة")}</section>
`;
  h += statTiles(rows, y);
  h += matrixHTML(rows);
  if (!rows.length) return h + `<div class="card muted">لا توجد أسماء بعد. أضفها من تبويب «الأعضاء».</div>`;

  for (const x of rows){
    const sup = supervisorOf(x.id);
    const ti = rk.info[x.id];
    h += `<tr><td class="num">${rk[x.id] || ""}</td><td><b>${esc(nameOf(x.id))}</b>${tieNote(x.id, rk)}</td><td>${sup ? esc(nameOf(sup)) : `<span class="muted">غير محدد</span>`}</td>` +

  return h + `</tbody></table></section>`;

  x.fillStyle = "#ffffff"; x.textAlign = "right"; x.font = PF(34, 700); x.fillText(title, PR, 60);
  x.font = PF(20, 400); x.fillText(sub, PR, 98);
  x.textAlign = "left"; x.fillText("تاريخ الإصدار: " + dayLabel(new Date()), PM, 98);

}
function pdfFit(x, t, w){ t = String(t); if (x.measureText(t).width <= w) return t; while (t.length > 2 && x.measureText(t + "…").width > w) t = t.slice(0, -1); return t + "…"; }

  opt = opt || {}; const rh = opt.rh || 42, fs = opt.fs || 19;

    let xr = PR; x.fillStyle = "#14211c"; x.font = PF(fs, bold ? 700 : 400);
    cols.forEach((col, i) => { const w = col.w * PCW; const t = pdfFit(x, cells[i] === undefined ? "" : cells[i], w - 16);
      if (col.a === "c"){ x.textAlign = "center"; x.fillText(t, xr - w / 2, yy + rh * 0.66); } else { x.textAlign = "right"; x.fillText(t, xr - 8, yy + rh * 0.66); }
      xr -= w; });
    x.fillStyle = "#cfd8d3"; x.fillRect(PM, yy + rh - 1, PCW, 1);
  };
  /* رأس الجدول: يلتف النص على سطرين إن لم يتسع */
  const hh = Math.round(rh * 1.5); x.fillStyle = "#e3efe9"; x.fillRect(PM, y, PCW, hh);
  let hx = PR; x.fillStyle = "#14211c"; x.font = PF(fs - 1, 700);
  cols.forEach((col, i) => { const w = col.w * PCW, t = String(head[i] === undefined ? "" : head[i]), words = t.split(" "); let lines = [t];
    if (x.measureText(t).width > w - 12 && words.length > 1){ let best = 1, bw = Infinity; for (let k = 1; k < words.length; k++){ const m = Math.max(x.measureText(words.slice(0, k).join(" ")).width, x.measureText(words.slice(k).join(" ")).width); if (m < bw){ bw = m; best = k; } } lines = [words.slice(0, best).join(" "), words.slice(best).join(" ")]; }

      if (col.a === "c"){ x.textAlign = "center"; x.fillText(tt, hx - w / 2, ty); } else { x.textAlign = "right"; x.fillText(tt, hx - 8, ty); } });
    hx -= w; });
  y += hh;
  rows.forEach((r, i) => { draw(r.cells || r, y, !!r.bold, r.bold ? "#f1f6f3" : null); y += rh; });
  return y + 22;
}
function pdfStatus(r, t){ return t.rem === 0 ? "تحقق" : t.q ? (t.has ? "دون المطلوب" : "لا إدخال") : (r.fr > 0 && r.fr < 1 ? (t.diff >= -0.5 ? "على المسار" : "متأخر") : "لم يتحقق بعد"); }

  const ncol = 1 + qa.length * 2 + 1 + nf.length, cw = (1 - .17) / (ncol - 1), cols = [{w:.17}]; for (let i = 1; i < ncol; i++) cols.push({ w:cw, a:"c" });
  const head = ["الشهر"]; qa.forEach(a => { head.push(a.name); head.push("الجودة"); }); head.push("العمليات"); nf.forEach(f => head.push(f.label));
  const mrows = keys.map(k => { const m = monthCalc(S.config, ms[k].values), row = [monthLabel(k)]; qa.forEach(a => { row.push(f0(m.ax[a.id].sum)); row.push(f0(m.ax[a.id].q * 100) + "%"); }); row.push(f0(m.ops)); nf.forEach(f => row.push(f0(m.fl[f.id]))); return row; });

  x.textAlign = "left"; x.fillText("توقيع المشرف: ..............................", PM, PH - 90);
  return c;
}
function pdfSummary(ids, calcs, rk, y, who){
  const { c, x } = pdfPage("ملخص أداء المراقبين", "سنة " + y + (who ? " · " + who : ""));
  let yy = 180; yy = pdfTitle(x, yy, "الترتيب بالدرجة");
  const base = calc(S.config, [], yearFrac(y)), nt = base.targets.length, w0 = .05, w1 = .24, w2 = .09, w3 = .15, wt = (1 - w0 - w1 - w2 - w3) / Math.max(1, nt);
  const cols = [{w:w0,a:"c"},{w:w1},{w:w2,a:"c"},{w:w3,a:"c"}].concat(base.targets.map(() => ({ w:wt, a:"c" })));
  const rows = ids.map((id, i) => ({ id, r: calcs[i] })).sort((a,b) => (rk[a.id] || 1e9) - (rk[b.id] || 1e9)).map(o => o.r

async function pdfBuild(canvases){
  const enc = s => new TextEncoder().encode(s), parts = [], offs = []; let len = 0;
  const push = b => { parts.push(b); len += b.length; }, obj = (n, body) => { offs[n] = len; push(enc(n + " 0 obj\n")); body.forEach(push); push(enc("\nendobj\n")); };

  for (const c of canvases){ const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.9)); imgs.push(new Uint8Array(await blob.arrayBuffer())); }
  push(enc("%PDF-1.4\n%âãÏÓ\n".replace(/[\u0080-￿]/g, "?")));
  const N = canvases.length, kids = []; for (let i = 0; i < N; i++) kids.push((3 + i * 3) + " 0 R");
  obj(1, [enc("<< /Type /Catalog /Pages 2 0 R >>")]);
  obj(2, [enc("<< /Type /Pages /Count " + N + " /Kids [" + kids.join(" ") + "] >>")]);
  for (let i = 0; i < N; i++){
    const p = 3 + i * 3, content = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(p, [enc("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 " + (p + 2) + " 0 R >> >> /Contents " + (p + 1) + " 0 R >>")]);
    obj(p + 1, [enc("<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream")]);
    obj(p + 2, [enc("<< /Type /XObject /Subtype /Image /Width " + canvases[i].width + " /Height " + canvases[i].height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + imgs[i].length + " >>\nstream\n"), imgs[i], enc("\nendstream")]);
  }
  const total = 3 + N * 3, xref = len; let x = "xref\n0 " + total + "\n0000000000 65535 f \n";
  for (let n = 1; n < total; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  push(enc(x + "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n"));
  return new Blob(parts, { type: "application/pdf" });
}
async function pdfExport(ids, withSummary, who, fname){
  const y = yearOf(), rk = rankMap(y), calcs = ids.map(id => yearCalc(id, y)), pages = [];

  ids.forEach((id, i) => { if (!withSummary || calcs[i]) pages.push(pdfEmployee(id, calcs[i], rk, y)); });

  if (S.dl){ try { await S.dl.save({ filename, data: blob }); toast("تم تجهيز الملف."); } catch(e){ toast(e && e.code === "declined" ? "أُلغي التنزيل." : "تعذر تنزيل الملف الآن."); } return; }

    const people = clone(S.roster), i = +(t.dataset.rn ?? t.dataset.rr ?? t.dataset.rs), p = people[i]; if (!p) return;

    b.disabled = true; let d = null;
    try { d = mgr ? await rpc("m_login_manager", { p_code: secret }) : await rpc("m_login", { p_person: pid, p_pin: secret }); } catch(e){ toast("تعذر الاتصال. تحقق من الإنترنت."); b.disabled = false; return; }
    if (d.error){ toast(ERR[d.error] || "تعذر الدخول."); b.disabled = false; return; }
    tokenSet(d.token); S.view = null; await refresh(); render();
    if (d.first) toast("تم تعيين رمز المدير. احفظه جيداً.");
  }
  else if (act === "logout"){ const t = S.token; tokenSet(""); S.me = null; S.charters = {}; S.anon = []; S.reviews = {}; S.draft = {}; render(); try { await rpc("m_logout", { p_token: t }); } catch(e){} refresh().then(render); }
  else if (act === "set-pin"){ const p = S.roster[+b.dataset.i], v = document.getElementById("pin-" + b.dataset.i).value.trim();
    if (v.length < 4){ toast("الرقم الأولي 4 أرقام على الأقل."); return; }
    if (await call("m_set_pin", { p_person: p.id, p_pin: v })){ await refresh(); toast("تم تعيين رقم أولي لـ " + p.name + "."); render(); } }
  else if (act === "gen-pins"){
    const todo = S.roster.filter(p => !p.hasPin); if (!todo.length){ toast("كل الأسماء لها أرقام."); return; }
    b.disabled = true; const out = [];
    for (const p of todo){ const a = new Uint32Array(1); crypto.getRandomValues(a); const pin = String(100000 + a[0] % 900000);
      if (await call("m_set_pin", { p_person: p.id, p_pin: pin })) out.push({ name: p.name, pin }); else break; }
    S.pinList = out; await refresh(); toast("تم توليد " + out.length + " رقماً أولياً."); render(); }
  else if (act === "copy-pins"){ try { await navigator.clipboard.writeText(S.pinList.map(x => x.name + ": " + x.pin).join("\n")); toast("تم نسخ القائمة."); } catch(e){ toast("تعذر النسخ. انسخها يدوياً."); } }
  else if (act === "hide-pins"){ S.pinList = []; render(); }
  else if (act === "change-pin"){ const a = document.getElementById("np-1").value, c = document.getElementById("np-2").value;
    if (a.length < 4){ toast("الرقم السري 4 أرقام على الأقل."); return; } if (a !== c){ toast("الرقمان غير متطابقين."); return; }
    if (await call("m_change_pin", { p_new: a })){ await refresh(); toast("تم حفظ رقمك السري الجديد."); render(); } }
  else if (act === "change-code"){ const v = document.getElementById("new-code").value; if (v.length < 6){ toast("الرمز 6 خانات على الأقل."); return; }
    if (await call("m_change_manager_code", { p_new: v })){ toast("تم تغيير رمز المدير."); render(); } }
  else if (act === "add-field"){ S.cfgDraft.axes[+b.dataset.i].fields.push({ id: uid("f"), label: "خانة جديدة", w: 0 }); render(); }
  else if (act === "del-field"){ S.cfgDraft.axes[+b.dataset.i].fields.splice(+b.dataset.j, 1); render(); }
  else if (act === "add-person"){ const people = clone(S.roster); people.push({ id: uid("p"), name: "اسم جديد", role: "employee" }); if (await saveRoster(people)) render(); }
  else if (act === "del-person"){
    if (delArmed !== b.dataset.i){ delArmed = b.dataset.i; b.textContent = "تأكيد الحذف مع أعماله"; return; } delArmed = null;
    const people = clone(S.roster), gone = people.splice(+b.dataset.i, 1)[0]; for (const q of people) if (gone && q.supervisorPid === gone.id) delete q.supervisorPid; if (await saveRoster(people)) render(); }
  else if (act === "pdf-one" || act === "pdf-team"){
    b.disabled = true; toast("جارٍ تجهيز الملف…");
    try {
      if (act === "pdf-one") await pdfExport([b.dataset.id], false, "", "ميثاق-" + nameOf(b.dataset.id).replace(/\s+/g, "-"));
      else { const all = S.me.manager, ids = all ? employeeIds() : employeeIds().filter(id => supervisorOf(id) === S.me.id);
        await pdfExport(ids, true, all ? "جميع المراقبين" : "فريق المشرف " + nameOf(S.me.id), all ? "تقرير-المراقبين" : "تقرير-الفريق"); }
    } catch(e){ toast("تعذر تجهيز الملف."); }
    b.disabled = false;
  }
  else if (act === "add-group"){ S.cfgDraft.groups.push({ id: uid("g"), label: "هدف مشترك", t: 0 }); render(); }
  else if (act === "del-group"){ const g = S.cfgDraft.groups.splice(+b.dataset.i, 1)[0]; for (const a of S.cfgDraft.axes) for (const f of a.fields) if (g && f.g === g.id) delete f.g; render(); }
  else if (act === "add-axis"){ S.cfgDraft.axes.push({ id: uid("a"), name: "محور جديد", quality: false, fields: [{ id: uid("f"), label: "خانة جديدة", w: 0 }] }); render(); }
  else if (act === "del-axis"){ S.cfgDraft.axes.splice(+b.dataset.i, 1); render(); }
  else if (act === "undo-cfg"){ S.cfgDraft = null; render(); }
  else if (act === "save-cfg"){
    const cfg = clone(S.cfgDraft);
    cfg.axes = cfg.axes.filter(a => a.fields.length);
    for (let i = 1; i < cfg.bands.length; i++) if (!(n(cfg.bands[i].from) > n(cfg.bands[i-1].from))){ toast("رتّب المستويات تصاعدياً: كل مستوى يبدأ من درجة أعلى من الذي قبله."); return; }
    if (!cfg.axes.length || !(n(cfg.maxScore) > 0)){ toast("أضف محوراً واحداً على الأقل فيه خانة، وحدد الدرجة المثالية."); return; }
    cfg.updatedAt = new Date().toISOString();
    if (await put("config/main", cfg, () => { S.config = cfg; })){ if (S.month.slice(0,4) !== String(Math.round(n(cfg.year)) || 2027)){ S.month = defaultMonth(Math.round(n(cfg.year)) || 2027); S.monthTouched = false; loadDraft(); } S.cfgDraft = null; toast("تم حفظ المعادلة."); render(); }
  }
});

/* ---------- التشغيل ---------- */
S.me = null; S.token = tokenGet(); S.anon = []; S.coverage = {}; S.managerSet = false; S.online = true;
async function start(){
  await refresh(); render();
  setInterval(async () => { if (document.hidden || !S.me) return; await refresh(); scheduleRender(); }, 90000);
}
start();
</script>
</body>
</html>
